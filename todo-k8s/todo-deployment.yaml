apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
      - name: todo-backend
        image: todo-backend:latest
        imagePullPolicy: Never
        ports:
          - containerPort: 9090
        env:
          - name: DB_URL
            valueFrom:
              configMapKeyRef:
                name: todo-config
                key: DB_URL
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: todo-secret
                key: DB_USER
          - name: SERVER_PORT
            value: "9090"
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: todo-secret
                key: DB_PASS
          - name: ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: todo-secret
                key: ENCRYPTION_KEY
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: todo-secret
                key: JWT_SECRET
