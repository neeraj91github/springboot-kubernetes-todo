spring.application.name=todo-backend

# SQL Server DB config
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=todo_app;trustServerCertificate=true}
spring.datasource.username=${DB_USER:SA}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Application security secrets - supply through environment variables / Kubernetes Secrets.
app.encryption.key=${ENCRYPTION_KEY}
app.jwt.secret=${JWT_SECRET}

# JPA settings
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.SQLServerDialect}
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Server
server.port=${SERVER_PORT:9090}
server.address=0.0.0.0
